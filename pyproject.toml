[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nuscope-tomo"
version = "0.3.1"
description = "Open FIB-SEM slice-and-view tomography: alignment, artifact correction, ML segmentation, 3D quantification and correlative EDS chemistry, with a browser-based Studio."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Roberto dos Reis", email = "robertomsreis@gmail.com" }]
maintainers = [{ name = "Roberto dos Reis (@rmsreis)" }]
keywords = ["FIB-SEM", "slice and view", "tomography", "segmentation", "EDS", "microscopy", "Avizo alternative", "materials science"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-image>=0.24",
    "scikit-learn>=1.4",
    "dask[array]>=2024.1",
    "zarr>=3.0",
    "tifffile",
    "imageio",
    "imageio-ffmpeg",
    "pywavelets",
    "pandas",
    "pyyaml",
    "matplotlib",
    "pyvista>=0.44",
    "pyamg",
    "fastapi",
    "uvicorn[standard]",
]

[project.optional-dependencies]
dev = ["pytest", "httpx", "build", "twine"]
ai = ["torch>=2.2"]

[project.urls]
Homepage = "https://github.com/NUANCE-IT/NUScope-TOMO"
Issues = "https://github.com/NUANCE-IT/NUScope-TOMO/issues"
NUScope = "https://nuance-it.github.io/NUScope/"
Author = "https://github.com/rmsreis"

[project.scripts]
nuscope-tomo = "nuscope_tomo.cli:main"

# Also available as `nuscope tomo ...` when the NUScope platform package is installed.
[project.entry-points."nuscope.commands"]
tomo = "nuscope_tomo.cli:main"

# NUANCE-MCP tools for tomography projects (see nuscope_tomo.mcp)
[project.entry-points."nuance_mcp.plugins"]
tomo = "nuscope_tomo.mcp:register"

[tool.setuptools.packages.find]
include = ["nuscope_tomo*"]

[tool.setuptools.package-data]
"nuscope_tomo.studio" = ["static/*"]
